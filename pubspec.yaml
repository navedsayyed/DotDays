name: dotdays
description: "Life in Dots — Every dot is a day of your life."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Storage
  shared_preferences: ^2.3.1

  # Background jobs
  workmanager: ^0.9.0

  # Wallpaper
  wallpaper_manager_flutter: ^1.0.1

  # Image rendering
  path_provider: ^2.1.3

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
